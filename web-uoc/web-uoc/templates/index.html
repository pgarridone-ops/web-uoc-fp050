<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>web-uoc</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; color: #1d2733;
           display: flex; justify-content: center; padding-top: 60px; }
    .tarjeta { background: #fff; border-radius: 12px; padding: 32px 40px;
               box-shadow: 0 2px 10px rgba(0,0,0,.1); text-align: center; }
    h1 { color: #003366; }
    img { max-width: 320px; margin: 16px 0; }
    .datos { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>{{.Mensaje}}</h1>
    <img src="/static/logo.png" alt="Logo">
    <p class="datos">Servidor: <b>{{.Servidor}}</b></p>
    <p class="datos">Entorno: <b>{{.Entorno}}</b></p>
    <p class="datos">Hora: {{.Hora}}</p>
  </div>
</body>
</html>
